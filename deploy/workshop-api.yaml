apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: gaos-workshop-api
  annotations:
    run.googleapis.com/launch-stage: BETA
    spec:
      template:
        metadata:
          annotations:
            autoscaling.knative.dev/maxScale: '1'
            run.googleapis.com/sessionAffinity: 'true'
            run.googleapis.com/cpu-throttling: 'false'
            run.googleapis.com/cloudsql-instances: PROJECT:REGION:INSTANCE
    spec:
      containerConcurrency: 80
      timeoutSeconds: 3600
      containers:
        - name: workshop-api
          image: IMAGE
          sandboxLauncher: true
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '2'
              memory: 2Gi
          env:
            - name: PORT
              value: '8080'
            - name: DATABASE_URL
              value: postgres://gaos@localhost/gaos
            - name: AGENT_URL
              value: https://gaos-agent-host
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: INTERNAL_TOKEN
                  key: latest
            - name: GAOS_GADGET_SOCKET_ROOT
              value: /tmp/gaos-gadgets
            - name: GAOS_SANDBOX
              value: cloudrun
      # max-instances=1 until tar-restart exists
---
# gcloud run services update gaos-workshop-api --max-instances=1 --timeout=3600 --session-affinity
